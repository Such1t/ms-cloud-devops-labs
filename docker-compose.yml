services:
  backend:
    build: ./backend
    environment:
      PORT: 3000
      DATA_FILE: /app/data/notes.json
      CORS_ORIGIN: ""
    volumes:
      - notes-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 10s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        API_URL: /backend
    ports:
      - "8082:80"
    depends_on:
      backend:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: notes_user
      POSTGRES_PASSWORD: notes_password
      POSTGRES_DB: notes_db
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  notes-data:
  db-data:
