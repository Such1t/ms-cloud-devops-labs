server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
        index index.html;
    }

    location /backend/ {
        proxy_pass http://backend:3000/;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
